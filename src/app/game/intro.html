<div class="intro">
  <div class="stage">
    <canvas #canvas></canvas>

    <div class="hand" #hand [class.on]="gesture() !== null" [class.drag]="gesture() === 'drag'">
      <span class="hand__ring"></span>
      <svg
        class="hand__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 12V4.6a1.6 1.6 0 0 1 3.2 0V11" />
        <path d="M12.2 11V6.9a1.6 1.6 0 0 1 3.2 0V11.6" />
        <path
          d="M15.4 11.6V9.2a1.6 1.6 0 0 1 3.2 0V15a6.4 6.4 0 0 1-6.4 6.4h-1a5 5 0 0 1-3.9-1.9l-3.2-4a1.7 1.7 0 0 1 2.5-2.3L9 15.4"
        />
        <path d="M9 12v3.4" />
      </svg>
    </div>

    <header class="brand">
      <span class="brand__mark"></span>
      <h1>Snowcube</h1>
    </header>
  </div>

  <div class="script">
    <div class="script__dots">
      @for (item of chapters; track item.title) {
        <span [class.on]="$index <= chapter()"></span>
      }
    </div>
    <h2>{{ step().title }}</h2>
    <p>{{ step().caption }}</p>
    @if (step().hint) {
      <p class="script__hint">{{ step().hint }}</p>
    }
    <button type="button" [class.primary]="finished()" (click)="finish()">
      {{ finished() ? 'Play' : 'Skip intro' }}
    </button>
  </div>
</div>
